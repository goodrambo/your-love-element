name: harness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify project Harness
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          HARNESS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/harness.py verify --scope all --ci
